name: Destruir ambiente AWS

# Remove toda a infraestrutura (use depois da apresentação para não gastar o crédito do lab).
# Apaga também o banco RDS. Não apaga o bucket do state.
on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: 'Digite DESTRUIR para confirmar'
        required: true

permissions:
  contents: read

jobs:
  destruir:
    if: inputs.confirmacao == 'DESTRUIR'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra
    env:
      AWS_REGION: us-east-1
      TF_VAR_aws_region: us-east-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: terraform init
        run: |
          CONTA=$(aws sts get-caller-identity --query Account --output text)
          terraform init -input=false \
            -backend-config="bucket=mentor-tfstate-$CONTA" \
            -backend-config="key=mentor/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: terraform destroy
        run: terraform destroy -input=false -auto-approve
