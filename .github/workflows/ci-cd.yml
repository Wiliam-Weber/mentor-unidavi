name: CI/CD Mentor UNIDAVI

# Em todo push/PR: testes + scans de segurança (bloqueiam se algo reprovar).
# Na main (ou manualmente em Actions > Run workflow): deploy na AWS. O banco (RDS) é privado:
# as migrações rodam dentro da VPC, na subida das instâncias.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      seed_demo:
        description: 'Criar os dados de demonstração (usuários @demo.unidavi.edu.br)'
        type: boolean
        default: false

# Menor privilégio para o GITHUB_TOKEN (cada job pede só o que precisa)
permissions:
  contents: read

concurrency:
  group: mentor-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.10.5

jobs:
  # ------------------------------------------------------------------
  # Descobre se a AWS já foi configurada. Sem os secrets, o pipeline roda
  # testes e scans normalmente e só pula o deploy (com um aviso), em vez de falhar.
  config:
    name: Verificar configuração
    runs-on: ubuntu-latest
    outputs:
      pronto: ${{ steps.v.outputs.pronto }}
    steps:
      - id: v
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          faltando=""
          for s in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN; do
            [ -n "${!s}" ] || faltando="$faltando $s"
          done
          if [ -n "$faltando" ]; then
            echo "pronto=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Deploy pulado. Secrets não configurados:$faltando (veja docs/DEPLOY-AWS.md)"
            echo "### Deploy pulado: configure os secrets$faltando (docs/DEPLOY-AWS.md)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "pronto=true" >> "$GITHUB_OUTPUT"
          fi

  # ------------------------------------------------------------------
  testes:
    name: Testes e auditoria de dependências
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Testes automatizados (API + anti-trapaça do jogo)
        run: npm test
      - name: npm audit (falha com vulnerabilidade HIGH/CRITICAL)
        run: npm audit --audit-level=high
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura
          path: app/coverage/lcov.info

  # ------------------------------------------------------------------
  analise-estatica:
    name: Análise estática de segurança (SAST, segredos, IaC)
    needs: testes
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # histórico completo para Gitleaks e SonarQube

      - name: Gitleaks - segredos no código e em todo o histórico do Git
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
          ./gitleaks git . --redact --no-banner -v

      - name: Semgrep - SAST com regras de segurança (Express, JWT, crypto, navegador, segredos)
        # Versão e regras fixadas (commit) para o resultado ser reproduzível; não depende de conta
        run: |
          pip install --quiet semgrep==1.186.0
          git clone --quiet https://github.com/semgrep/semgrep-rules.git /tmp/regras
          git -C /tmp/regras checkout --quiet a5ad1714f00c9f7fde980cab0ea1d6dc6d414fd2
          R=/tmp/regras
          semgrep scan --metrics=off --disable-version-check --error \
            --severity ERROR --severity WARNING \
            --config $R/javascript/express/security --config $R/javascript/lang/security \
            --config $R/javascript/jsonwebtoken/security --config $R/javascript/browser/security \
            --config $R/javascript/node-crypto/security --config $R/generic/secrets/security \
            app/src app/public/js app/scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.SONAR_TOKEN != ''
        with:
          name: cobertura
          path: app/coverage

      - name: SonarCloud - parâmetros do projeto
        if: env.SONAR_TOKEN != ''
        id: sonar
        env:
          ORG: ${{ vars.SONAR_ORGANIZATION }}
          CHAVE: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          # Padrão do SonarCloud ao importar do GitHub: organização = dono em minúsculas, chave = dono_repositório
          echo "org=${ORG:-${GITHUB_REPOSITORY_OWNER,,}}" >> "$GITHUB_OUTPUT"
          echo "chave=${CHAVE:-${GITHUB_REPOSITORY_OWNER}_${GITHUB_REPOSITORY#*/}}" >> "$GITHUB_OUTPUT"

      - name: SonarQube / SonarCloud - SAST, qualidade e Quality Gate (bloqueia se reprovado)
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          args: >
            -Dsonar.organization=${{ steps.sonar.outputs.org }}
            -Dsonar.projectKey=${{ steps.sonar.outputs.chave }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: Aviso - SonarQube não configurado
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN não configurado. O SonarQube foi pulado (Semgrep, Gitleaks, Checkov e Trivy rodaram). Veja docs/DEPLOY-AWS.md."

      - name: Checkov - scan estático do Terraform
        uses: bridgecrewio/checkov-action@83b08f51b20950f791f5caadcc92e336b371eb12 # v12.3143.0
        with:
          directory: infra
          config_file: infra/.checkov.yaml
          quiet: true

      - name: Trivy - vulnerabilidades, segredos e configurações no repositório
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-dirs: infra # o Terraform já é analisado pelo Checkov

  # ------------------------------------------------------------------
  imagem:
    name: Build e scan da imagem Docker
    needs: analise-estatica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build -f app/Dockerfile -t mentor:${{ github.sha }} .
      - name: Trivy - scan da imagem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mentor:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Guardar a imagem aprovada para o deploy
        if: github.event_name != 'pull_request'
        run: docker save mentor:${{ github.sha }} | gzip > imagem.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: imagem
          path: imagem.tar.gz
          retention-days: 3

  # ------------------------------------------------------------------
  deploy:
    name: Deploy na AWS (Terraform)
    needs: [config, imagem]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.config.outputs.pronto == 'true'
    runs-on: ubuntu-latest
    environment: production # aprovação manual (opcional) antes de alterar a AWS
    defaults:
      run:
        working-directory: infra
    env:
      TF_IN_AUTOMATION: 'true'
      TF_VAR_image_tag: ${{ github.sha }}
      TF_VAR_aws_region: us-east-1
      # Ajustes sem editar o código: Settings > Secrets and variables > Actions > Variables
      TF_VAR_habilitar_waf: ${{ vars.HABILITAR_WAF || 'true' }}
      TF_VAR_lab_role_name: ${{ vars.LAB_ROLE_NAME || 'LabRole' }}
      TF_VAR_db_instance_class: ${{ vars.DB_INSTANCE_CLASS || 'db.t3.micro' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # AWS Academy: credenciais temporárias do Learner Lab (atualizar os 3 secrets a cada sessão do lab)
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Bucket do state do Terraform (cria na primeira vez)
        id: state
        run: |
          CONTA=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="mentor-tfstate-$CONTA"
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET" --region "$AWS_REGION"
            aws s3api put-bucket-versioning --bucket "$BUCKET" --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$BUCKET" \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-public-access-block --bucket "$BUCKET" --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          fi
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ steps.state.outputs.bucket }}" \
            -backend-config="key=mentor/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - run: terraform validate

      # Etapa 1: cria o que precisa existir antes das instâncias (chave KMS, ECR e segredo)
      - name: terraform apply - base (KMS, ECR, Secrets Manager)
        run: |
          terraform apply -input=false -auto-approve \
            -target=aws_kms_alias.app -target=aws_ecr_repository.app \
            -target=aws_ecr_lifecycle_policy.app -target=aws_secretsmanager_secret.app

      - name: Gerar/atualizar o segredo da aplicação no Secrets Manager
        env:
          SEED_DEMO: ${{ inputs.seed_demo && '1' || '0' }}
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD || 'Demo#Mentor2026' }}
        run: |
          SEGREDO=$(terraform output -raw segredo_nome)
          ATUAL=$(aws secretsmanager get-secret-value --secret-id "$SEGREDO" --query SecretString --output text 2>/dev/null || echo '{}')
          # JWT_SECRET e a senha do usuário mentor_app são gerados UMA vez, aleatórios, e reaproveitados nos
          # próximos deploys. Ninguém precisa criá-los nem conhecê-los; nada é impresso no log.
          JWT=$(echo "$ATUAL" | jq -r '.JWT_SECRET // empty'); [ -n "$JWT" ] || JWT=$(openssl rand -base64 48)
          APP=$(echo "$ATUAL" | jq -r '.APP_DB_PASSWORD // empty'); [ -n "$APP" ] || APP=$(openssl rand -hex 24)
          echo "::add-mask::$JWT"; echo "::add-mask::$APP"
          jq -n --arg j "$JWT" --arg a "$APP" --arg s "$SEED_DEMO" --arg p "$SEED_PASSWORD" \
            '{JWT_SECRET:$j, APP_DB_PASSWORD:$a, SEED_DEMO:$s, SEED_PASSWORD:$p}' > /tmp/segredo.json
          aws secretsmanager put-secret-value --secret-id "$SEGREDO" --secret-string file:///tmp/segredo.json > /dev/null
          shred -u /tmp/segredo.json

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: imagem
          path: /tmp

      - name: Publicar a imagem aprovada no ECR
        run: |
          REPO=$(terraform output -raw ecr_repositorio)
          aws ecr get-login-password | docker login --username AWS --password-stdin "${REPO%%/*}"
          gunzip -c /tmp/imagem.tar.gz | docker load
          docker tag "mentor:${{ github.sha }}" "$REPO:${{ github.sha }}"
          if aws ecr describe-images --repository-name "${REPO##*/}" --image-ids imageTag=${{ github.sha }} >/dev/null 2>&1; then
            echo "Imagem já publicada (tags são imutáveis)"
          else
            docker push "$REPO:${{ github.sha }}"
          fi

      # Etapa 2: rede, ALB, WAF, Auto Scaling... (nova imagem => instance refresh sem downtime)
      - run: terraform plan -input=false -out=plano.tfplan
      - name: terraform apply - completo
        run: terraform apply -input=false plano.tfplan

      - name: Resumo
        run: |
          URL=$(terraform output -raw url_aplicacao)
          {
            echo "## Mentor UNIDAVI publicado"
            echo ""
            echo "**URL:** $URL"
            echo ""
            echo "As instâncias levam de 3 a 5 minutos para ficar saudáveis no Load Balancer"
            echo "(no primeiro deploy o RDS leva cerca de 10 minutos para ser criado)."
            echo "Imagem: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "URL da aplicação: $URL"
